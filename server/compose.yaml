services:
  ocr:
    build: .
    image: ocr-search-service:latest
    env_file: .env
    ports:
      - "${OCR_PUBLISH:-127.0.0.1:8080}:8080"
    mem_limit: 1g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
