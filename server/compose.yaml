services:
  ocr:
    # Released images are published on GHCR; `docker compose up --build` builds
    # the same image from this directory instead.
    image: ghcr.io/ruruthegeek/nextcloud-ocr-search-service:latest
    build: .
    env_file: .env
    ports:
      - "${OCR_PUBLISH:-127.0.0.1:8080}:8080"
    mem_limit: 1g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
