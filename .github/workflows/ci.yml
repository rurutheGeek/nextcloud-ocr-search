name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Nextcloud ${{ matrix.nextcloud }} on ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nextcloud: '33', db: sqlite}
          - {nextcloud: '33', db: mysql}
          - {nextcloud: '33', db: pgsql}
          - {nextcloud: '34', db: sqlite}
          - {nextcloud: '35', db: sqlite}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The committed bundle and translations must match the source
        run: git diff --exit-code js/ l10n/
      - name: XML schema sanity (well-formed)
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('appinfo/info.xml')"
      - name: Start the database
        if: matrix.db != 'sqlite'
        run: |
          docker network create nc
          if [ "${{ matrix.db }}" = mysql ]; then
            docker run -d --name db --network nc -e MARIADB_DATABASE=nextcloud -e MARIADB_USER=nextcloud \
              -e MARIADB_PASSWORD=nextcloud -e MARIADB_RANDOM_ROOT_PASSWORD=1 mariadb:11 \
              --transaction-isolation=READ-COMMITTED
          else
            docker run -d --name db --network nc -e POSTGRES_DB=nextcloud -e POSTGRES_USER=nextcloud \
              -e POSTGRES_PASSWORD=nextcloud postgres:17-alpine
          fi
          sleep 25
      - name: PHP lint and tests inside Nextcloud
        run: |
          network=""
          [ "${{ matrix.db }}" = sqlite ] || network="--network nc"
          docker run --rm $network -e DB=${{ matrix.db }} -e DB_HOST=db -v "$PWD":/app:ro \
            nextcloud:${{ matrix.nextcloud }}-apache sh /app/tests/run.sh

  server:
    name: OCR service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy ruff
      - run: ruff check server/
      - name: Unit tests
        run: python3 -m unittest discover -s server/tests -v
      - name: Build the container
        run: docker build -t ocr-search-service:ci server/
      - name: The container answers without network access
        run: |
          docker run -d --name ocr --network none --read-only --tmpfs /tmp -e OCR_TOKEN=ci ocr-search-service:ci
          for _ in $(seq 30); do
            [ "$(docker inspect ocr --format '{{.State.Health.Status}}')" = healthy ] && exit 0
            sleep 2
          done
          docker logs ocr
          exit 1
