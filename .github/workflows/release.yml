name: Release

# Builds the app archive for a published GitHub release and attaches it.
#
# Publishing to the Nextcloud App Store is a separate job that runs only when
# the repository variable APPSTORE_ENABLED is true. That job uses the
# `appstore` environment: add required reviewers in the repository settings
# (Settings -> Environments -> appstore) and every store release waits for an
# approval before anything is uploaded. Pre-releases are published as nightly.
#
# Secrets of the `appstore` environment: APP_PRIVATE_KEY, APPSTORE_TOKEN
# Repository variable: APPSTORE_ENABLED=true (after the app is registered)
#
# The certificate is obtained once via a pull request to
# https://github.com/nextcloud/app-certificate-requests (see README).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: ocr_search

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check that the tag matches appinfo/info.xml
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('appinfo/info.xml').findtext('version'))")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match appinfo/info.xml version $version"
            exit 1
          fi

      - name: Build the app bundle
        run: npm ci && npm run build

      - name: Build the release archive
        run: |
          mkdir -p build/artifacts
          tar \
            --exclude='./node_modules' \
            --exclude='./build' \
            --exclude='./tools' \
            --exclude='./server' \
            --exclude='./tests' \
            --exclude='./screenshots' \
            --exclude='./src' \
            --exclude='./package.json' \
            --exclude='./package-lock.json' \
            --exclude='./phpunit.xml' \
            --exclude='./.github' \
            --exclude='./krankerl.toml' \
            --exclude='./.gitignore' \
            --exclude='./.nextcloudignore' \
            --exclude='./.git' \
            --transform "s,^\.,${APP_ID}," \
            -czf "build/artifacts/${APP_ID}.tar.gz" .
          if tar tzf "build/artifacts/${APP_ID}.tar.gz" | grep -E "^${APP_ID}/(build|tools|server|tests|src|screenshots|node_modules)/"; then
            echo "::error::the archive contains files that do not belong to the app"
            exit 1
          fi

      - name: Attach the archive to the GitHub release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          file: build/artifacts/ocr_search.tar.gz
          asset_name: ocr_search.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

      - name: Keep the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr_search.tar.gz
          path: build/artifacts/ocr_search.tar.gz

  publish:
    needs: package
    if: github.event_name == 'release' && vars.APPSTORE_ENABLED == 'true'
    # Waits for the reviewers configured on this environment.
    environment: appstore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: ocr_search.tar.gz
          path: build/artifacts

      # The store API is called directly: krankerl 0.14's HTTP client fails
      # against the store with "invalid HTTP version parsed".
      - name: Publish to the Nextcloud App Store
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/${{ env.APP_ID }}.tar.gz
          NIGHTLY: ${{ github.event.release.prerelease }}
        run: |
          archive="build/artifacts/${APP_ID}.tar.gz"
          key="$RUNNER_TEMP/${APP_ID}.key"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key"
          signature="$(openssl dgst -sha512 -sign "$key" "$archive" | base64 -w0)"
          rm -f "$key"
          # The store downloads the release asset and checks this signature
          # against it, so the asset must be the archive signed here.
          curl -fsSL -o published.tar.gz "$DOWNLOAD_URL"
          cmp published.tar.gz "$archive"
          jq -n --arg download "$DOWNLOAD_URL" --arg signature "$signature" \
            --argjson nightly "$NIGHTLY" \
            '{download: $download, signature: $signature, nightly: $nightly}' > release.json
          status="$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Token ${APPSTORE_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data @release.json https://apps.nextcloud.com/api/v1/apps/releases)"
          head -c 2000 response.txt; echo
          # 201: new release, 200: an existing release was updated.
          if [ "$status" != 201 ] && [ "$status" != 200 ]; then
            echo "::error::App Store answered HTTP $status"
            exit 1
          fi

  image:
    name: OCR service image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build and push the OCR service image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')-service"
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            -t "$image:$version" server/
          docker push "$image:$version"
          if [ "${{ github.event.release.prerelease }}" != true ]; then
            docker tag "$image:$version" "$image:latest"
            docker push "$image:latest"
          fi
